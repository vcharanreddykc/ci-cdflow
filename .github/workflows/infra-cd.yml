name: CD Pipeline

on:
  repository_dispatch:
    types: [deploy-application]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.client_payload.environment }}
    steps:

      # --------------------------
      # 1️⃣ Checkout Infra Repo
      # --------------------------
      - name: Checkout Infra Repo
        uses: actions/checkout@v4

      # --------------------------
      # 2️⃣ Read Manifest from Event
      # --------------------------
      - name: Parse Manifest
        id: parse
        run: |
          mkdir -p manifests
          echo "${{ github.event.client_payload.manifest_content }}" > manifests/${{ github.event.client_payload.environment }}.yml
          IMAGE_URI=$(yq e '.image_uri' manifests/${{ github.event.client_payload.environment }}.yml)
          IMAGE_TAG=$(yq e '.image_tag' manifests/${{ github.event.client_payload.environment }}.yml)
          ENV=$(yq e '.environment' manifests/${{ github.event.client_payload.environment }}.yml)
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "ENV=$ENV" >> $GITHUB_ENV

      # --------------------------
      # 3️⃣ Configure AWS via OIDC
      # --------------------------
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_${{ github.event.client_payload.environment | upper }} }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------
      # 4️⃣ Terraform Init
      # --------------------------
      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      # --------------------------
      # 5️⃣ Production Approval Step
      # --------------------------
      - name: Manual Approval for Production
        if: github.event.client_payload.environment == 'prod'
        uses: hmarr/auto-approve-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------
      # 6️⃣ Terraform Apply
      # --------------------------
      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve \
            -var "image_uri=${IMAGE_URI}" \
            -var "image_tag=${IMAGE_TAG}" \
            -var "environment=${ENV}"
